name: Bug report
description: Report a reproducible project defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe the incorrect result. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include a synthetic input, command, expected result, and actual result. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: Operating system and Python version }
    validations: { required: true }
